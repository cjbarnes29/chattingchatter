name: Release Chatter APK

# Run: GitHub → Actions → "Release Chatter APK" → Run workflow.
# The APK appears under Releases → "Chatter latest APK" and as a build artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Android files exist
        run: |
          missing=0
          for f in android/build.gradle android/settings.gradle android/variables.gradle android/gradle.properties \
                   android/app/build.gradle android/app/src/main/AndroidManifest.xml \
                   android/app/src/main/res/values/styles.xml android/app/src/main/res/values/strings.xml \
                   android/app/src/main/res/drawable/launch_bg.xml \
                   android/app/src/main/java/app/chatter/messenger/MainActivity.java \
                   android/app/src/main/res/xml/file_paths.xml \
                   android/app/src/main/res/layout/activity_main.xml; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Install web dependencies
        run: yarn install

      - name: Build web app and sync to Android
        run: |
          yarn build
          npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee ../gradle.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "=================== THE REAL ERROR ==================="
            grep -n -B2 -A12 -E "error:|ERROR|FAILED|What went wrong|AAPT|Could not|not found" ../gradle.log | head -120
          fi
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk chatter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chatter-apk
          path: chatter.apk
      - name: Publish APK (stable link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Chatter latest APK
          files: chatter.apk
          prerelease: false
          make_latest: false
